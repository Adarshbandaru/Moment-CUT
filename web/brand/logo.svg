<svg width="480" height="120" viewBox="0 0 480 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="logoSquircle">
      <rect width="100" height="100" rx="24"/>
    </clipPath>
  </defs>

  <!-- Mascot Icon (100x100) -->
  <g transform="translate(10, 10)">
    <rect width="100" height="100" rx="24" fill="#0D2B35"/>
    <image href="/brand/mascot.png" width="100" height="100" clip-path="url(#logoSquircle)"/>
    <rect x="1" y="1" width="98" height="98" rx="23" fill="none" stroke="#1ABCA4" stroke-width="2.5" opacity="0.6"/>
  </g>

  <!-- Typography: Moment in Deep Teal, CUT in Electric Pink -->
  <text x="126" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-1.2px" fill="#0D2B35">Moment<tspan fill="#FD337C">CUT</tspan></text>
</svg>